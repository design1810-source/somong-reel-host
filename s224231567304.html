<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>발길 멈추는 / 푸드코트 사진법</title><style>
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f6f4f0;color:#222}
.w{max-width:560px;margin:0 auto;padding:18px 16px 40px}h1{font-size:18px;margin:4px 0 16px}
.b{display:block;width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:18px;font-size:18px;font-weight:700;
text-align:center;text-decoration:none;margin:0 0 12px;cursor:pointer}
.c{background:#fee500;color:#191919}.d{background:#222;color:#fff}
#ok{text-align:center;color:#0a7d33;font-weight:700;min-height:22px;margin-bottom:8px}
pre{white-space:pre-wrap;word-break:keep-all;background:#fff;border-radius:12px;padding:16px;font-family:inherit;font-size:15px;line-height:1.6;
user-select:all;-webkit-user-select:all}</style></head><body><div class="w">
<h1>발길 멈추는 / 푸드코트 사진법</h1><button class="b c" onclick="cp()">📋 캡션 전체 복사</button><div id="ok"></div>
<a class="b d" href="https://raw.githubusercontent.com/design1810-source/somong-reel-host/main/p224231567304.mp4">⬇ 영상 저장하기</a><a class="b d" href="https://github.com/design1810-source/somong-reel-host/blob/main/p224231567304.mp4">▶ 영상 미리보기</a><pre id="t">공항 손님, 왜 그냥 지나칠까요? 짐 든 손님은 메뉴를 읽지 않고 사진만 보고 고릅니다. 고기 윤기에 누끼 컷까지 살린 한 장이 발길을 사로잡는 치트키! 발길 멈추는 푸드코트 음식사진촬영은 소몽컴퍼니! 문의는 프로필 링크로!

#푸드코트사진촬영 #음식사진촬영 #소몽컴퍼니</pre></div><script>
const T="공항 손님, 왜 그냥 지나칠까요? 짐 든 손님은 메뉴를 읽지 않고 사진만 보고 고릅니다. 고기 윤기에 누끼 컷까지 살린 한 장이 발길을 사로잡는 치트키! 발길 멈추는 푸드코트 음식사진촬영은 소몽컴퍼니! 문의는 프로필 링크로!\n\n#푸드코트사진촬영 #음식사진촬영 #소몽컴퍼니";
function done(){document.getElementById('ok').textContent='✅ 복사됐어요! 인스타에 붙여넣기 하세요';}
function fb(){const a=document.createElement('textarea');a.value=T;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';
document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,T.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}
document.body.removeChild(a);if(ok)done();else document.getElementById('ok').textContent='아래 글을 길게 눌러 전체 선택 → 복사해 주세요';}
function cp(){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(T).then(done,fb);}else fb();}
</script></body></html>

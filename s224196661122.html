.w{max-width:560px;margin:0 auto;padding:18px 16px 40px}h1{font-size:18px;margin:4px 0 16px}

<h1>주문 몰려드는 / 초밥 사진 비밀</h1><button class="b c" onclick="cp()">📋 캡션 전체 복사</button><div id="ok"></div>
<a class="b d" href="https://raw.githubusercontent.com/design1810-source/somong-reel-host/main/p224196661122.mp4">⬇ 영상 저장하기</a><a class="b d" href="https://github.com/design1810-source/somong-reel-host/blob/main/p224196661122.mp4">▶ 영상 미리보기</a><pre id="t">촬영문의 010-7600-0870
회는 싱싱한데 주문이 없다면? 초밥은 대각선으로 담아 밥과 회를 도톰하게, 흰 배경 누끼 컷에 배달앱 사이즈 보정까지 끝낸 한 장이 주문 폭주 치트키! 손님이 먼저 고르는 초밥 사진은 소몽컴퍼니에 맡겨보세요! 문의는 24시간 언제든!

#초밥사진촬영 #음식사진촬영 #소몽컴퍼니</pre></div><script>
const T="촬영문의 010-7600-0870\n회는 싱싱한데 주문이 없다면? 초밥은 대각선으로 담아 밥과 회를 도톰하게, 흰 배경 누끼 컷에 배달앱 사이즈 보정까지 끝낸 한 장이 주문 폭주 치트키! 손님이 먼저 고르는 초밥 사진은 소몽컴퍼니에 맡겨보세요! 문의는 24시간 언제든!\n\n#초밥사진촬영 #음식사진촬영 #소몽컴퍼니";
function done(){document.getElementById('ok').textContent='✅ 복사됐어요! 인스타에 붙여넣기 하세요';}
function fb(){const a=document.createElement('textarea');a.value=T;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';
document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,T.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}
document.body.removeChild(a);if(ok)done();else document.getElementById('ok').textContent='아래 글을 길게 눌러 전체 선택 → 복사해 주세요';}
function cp(){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(T).then(done,fb);}else fb();}
</script></body></html>

<h1>주문 폭발하는 / 국밥 사진 비법</h1><button class="b c" onclick="cp()">📋 캡션 전체 복사</button><div id="ok"></div>
<a class="b d" href="https://raw.githubusercontent.com/design1810-source/somong-reel-host/main/p224194264250.mp4">⬇ 영상 저장하기</a><a class="b d" href="https://github.com/design1810-source/somong-reel-host/blob/main/p224194264250.mp4">▶ 영상 미리보기</a><pre id="t">촬영문의 010-7600-0870
국밥값 내려도 주문 왜 안 늘까요? 김 오르는 국밥은 바짝 선명하게, 깍두기와 새우젓까지 푸짐하게! 같은 메뉴도 가성비 터지는 주문 폭주 치트키! 주문 들어오는 국밥 사진은 소몽컴퍼니에 맡겨보세요! 문의는 24시간 언제든!

#국밥사진촬영 #음식사진촬영 #소몽컴퍼니</pre></div><script>
const T="촬영문의 010-7600-0870\n국밥값 내려도 주문 왜 안 늘까요? 김 오르는 국밥은 바짝 선명하게, 깍두기와 새우젓까지 푸짐하게! 같은 메뉴도 가성비 터지는 주문 폭주 치트키! 주문 들어오는 국밥 사진은 소몽컴퍼니에 맡겨보세요! 문의는 24시간 언제든!\n\n#국밥사진촬영 #음식사진촬영 #소몽컴퍼니";
function done(){document.getElementById('ok').textContent='✅ 복사됐어요! 인스타에 붙여넣기 하세요';}
function fb(){const a=document.createElement('textarea');a.value=T;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';
document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,T.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}
document.body.removeChild(a);if(ok)done();else document.getElementById('ok').textContent='아래 글을 길게 눌러 전체 선택 → 복사해 주세요';}
function cp(){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(T).then(done,fb);}else fb();}
</script></body></html>
